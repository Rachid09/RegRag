<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RegRAG</title>
  <meta name="description" content="Ask questions about ADGM financial regulation and get answers that cite the exact rulebook passage.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">§</span>
      <div>
        <h1>RegRAG</h1>
        <p class="tagline">ADGM regulation assistant</p>
      </div>
    </div>
    <span class="status" id="status" role="status">
      <span class="dot"></span><span class="status-text">Connecting…</span>
    </span>
  </header>

  <main class="thread" id="thread" aria-live="polite">
    <section class="empty" id="empty">
      <h2>Ask about ADGM financial regulation</h2>
      <p>Every answer cites the exact rulebook passage it comes from.</p>
      <div class="suggestions">
        <button type="button" class="chip">What documentation must a Mining Reporting Entity keep to show a Production Target is based on reasonable grounds?</button>
        <button type="button" class="chip">Which capital requirements apply to an Authorised Person that provides credit and also engages in Spot Commodity activities?</button>
        <button type="button" class="chip">What internal controls should an Insurer have for fraud and fiduciary risks?</button>
      </div>
    </section>
  </main>

  <form class="composer" id="composer">
    <label class="sr-only" for="question">Your question</label>
    <textarea id="question" rows="1" maxlength="1000" placeholder="Ask a question about ADGM rules…" autocomplete="off"></textarea>
    <button type="submit" id="send" class="send" aria-label="Send">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>
  <p class="footnote">Answers come only from the ADGM rulebooks in the ObliQA dataset. Not legal advice.</p>

  <template id="tpl-user">
    <div class="msg user"><div class="bubble"></div></div>
  </template>
  <template id="tpl-bot">
    <div class="msg bot">
      <div class="answer"><span class="thinking">Searching the rulebooks…</span></div>
      <div class="sources" hidden>
        <h3>Sources</h3>
        <ol class="source-list"></ol>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
